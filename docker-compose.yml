# SQL Server for local development only. The password below is a throwaway local
# placeholder - never commit a real credential.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportdesk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Password1}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - supportdesk-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # DK-5: API service built from the Dockerfile (repo root as context).
  # Published on localhost:5080; reaches SQL Server via service name "sqlserver".
  # Only starts once SQL Server is healthy.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: supportdesk-api
    ports:
      - "5080:8080"
    environment:
      # DK-4: All secrets and config at runtime; nothing baked into the image.
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=SupportDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Password1};TrustServerCertificate=True;Encrypt=False"
      Authentication__Jwt__SecretKey: "${JWT_SECRET_KEY:-LocalDev_Jwt_Secret_Key_Change_In_Production_32chars!}"
      Authentication__Jwt__Issuer: "${JWT_ISSUER:-NorthwindSupportDesk}"
      Authentication__Jwt__Audience: "${JWT_AUDIENCE:-NorthwindSupportDesk}"
      Authentication__Jwt__ExpiryHours: "${JWT_EXPIRY_HOURS:-8}"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

volumes:
  supportdesk-sql:

